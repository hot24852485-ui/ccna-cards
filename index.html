<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCNA 800 字 - 多功能學習卡</title>
    <style>
        :root {
            --bg-color: #f7f5ed;
            --panel-bg: #f2ede0;
            --primary-btn: #709f93;
            --mode-listen: #d19ca0;
            --mode-type: #8ca3be;
            --mode-flash-ec: #d8be91;
            --mode-flash-ce: #a7c58f;
            --mode-fill: #bfa6d6;
            --card-bg: #ffffff;
            --text-dark: #2c3e50;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-dark); display: flex; flex-direction: column; align-items: center; padding: 20px 10px; min-height: 100vh; }
        .app-container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 15px; }

        /* 標頭與設置面板 */
        .title { text-align: center; font-size: 20px; font-weight: bold; color: #4a4a4a; margin-bottom: 5px; }
        .setting-panel { background-color: var(--panel-bg); border-radius: 16px; padding: 15px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .setting-row { display: flex; justify-content: center; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; color: #555; }
        select { padding: 6px 12px; border-radius: 8px; border: 1px solid #ccc; background: #fff; font-size: 14px; outline: none; }

        /* 功能按鈕選單 */
        .menu-grid { display: flex; flex-direction: column; gap: 10px; }
        .btn { border: none; padding: 12px; border-radius: 12px; font-size: 15px; font-weight: bold; color: white; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: all 0.2s ease; }
        .btn:active { transform: scale(0.98); }
        .btn-overview { background-color: var(--primary-btn); }
        .btn-listen { background-color: var(--mode-listen); }
        .btn-type { background-color: var(--mode-type); }
        .btn-flash-ec { background-color: var(--mode-flash-ec); }
        .btn-flash-ce { background-color: var(--mode-flash-ce); }
        .btn-fill { background-color: var(--mode-fill); }
        .btn-toggle { background-color: #ded7c6; color: #4a4a4a; box-shadow: none; border: 1px solid #c8c0b0; }

        /* 互動卡片顯示區 */
        .card-display { background: var(--card-bg); border-radius: 20px; padding: 25px; min-height: 220px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; box-shadow: 0 8px 16px rgba(0,0,0,0.08); position: relative; margin-top: 5px; }
        .card-term { font-size: 26px; font-weight: bold; margin-bottom: 10px; }
        .card-def { font-size: 16px; color: #555; line-height: 1.5; }
        .star-icon { position: absolute; top: 15px; right: 15px; font-size: 22px; cursor: pointer; color: #ccc; }
        .star-icon.active { color: #f59e0b; }
        .audio-play { font-size: 20px; cursor: pointer; margin-left: 8px; vertical-align: middle; }

        /* 控制按鈕 */
        .controls { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
        .control-btn { background: #fff; border: 1px solid #ccc; padding: 8px 16px; border-radius: 20px; font-weight: bold; cursor: pointer; }
        .input-box { width: 100%; padding: 10px; border: 2px solid #ccc; border-radius: 8px; font-size: 16px; margin-top: 10px; text-align: center; }

        /* 全覽清單頁面 */
        .overview-list { display: none; background: white; border-radius: 16px; padding: 15px; max-height: 400px; overflow-y: auto; text-align: left; }
        .overview-item { padding: 10px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="title">CCNA 核心單字學習卡</div>

    <div class="setting-panel">
        <div class="setting-row">
            🗣️ 腔調：
            <select id="accentSelect">
                <option value="en-US">美式 (US)</option>
                <option value="en-GB">英式 (UK)</option>
            </select>
        </div>
        <div class="setting-row">
            ⏱️ 語速：
            <select id="speedSelect">
                <option value="0.5">0.5x</option>
                <option value="0.75">0.75x</option>
                <option value="1.0" selected>1.0x</option>
                <option value="1.25">1.25x</option>
            </select>
        </div>
    </div>

    <div class="menu-grid">
        <button class="btn btn-overview" onclick="setMode('overview')">📖 全覽</button>
        <button class="btn btn-listen" onclick="setMode('listen')">👀 翻牌聽寫</button>
        <button class="btn btn-type" onclick="setMode('type')">⌨️ 鍵盤聽寫</button>
        <button class="btn btn-flash-ec" onclick="setMode('flash-ec')">🔤 閃卡 (英中)</button>
        <button class="btn btn-flash-ce" onclick="setMode('flash-ce')">🈳 閃卡 (中英)</button>
        <button class="btn btn-fill" onclick="setMode('fill')">✍️ 句子填空</button>
        <button class="btn btn-toggle" id="shuffleBtn" onclick="toggleShuffle()">🔀 隨機洗牌：關閉</button>
        <button class="btn btn-toggle" id="starFilterBtn" onclick="toggleStarFilter()">⭐ 只複習星號：關閉</button>
    </div>

    <div class="overview-list" id="overviewPanel"></div>

    <div class="card-display" id="cardPanel">
        <span class="star-icon" id="starBtn" onclick="toggleStar()">★</span>
        <div id="cardContent">
            <div class="card-term" id="termText">點選上方模式開始學習</div>
            <div class="card-def" id="defText"></div>
        </div>
    </div>

    <div class="controls" id="controlPanel">
        <button class="control-btn" onclick="prevCard()">上一張</button>
        <span id="progressText" style="font-weight: bold; color: #666;">0 / 0</span>
        <button class="control-btn" onclick="nextCard()">下一張</button>
    </div>
</div>

<script>
    const rawData = [
        { term: "Bandwidth", def: "頻寬：網路鏈路最大可傳輸資料的容量（如 1 Gbps）。", fill: "___ 代表網路鏈路最大可傳輸資料的容量。" },
        { term: "Throughput", def: "吞吐量：單位時間內實際成功傳送的資料量。", fill: "實際成功傳送的資料量稱為 ___。" },
        { term: "Latency", def: "延遲：封包從來源端到達目的地所需的時間。", fill: "封包傳送所需的時間稱為 ___。" },
        { term: "Jitter", def: "抖動：封包到達時間的不穩定性。", fill: "對 VoIP 影響巨大的封包到達延遲變化稱為 ___。" },
        { term: "Topology", def: "拓撲：網路設備與線路的架構與連接型態。", fill: "網路設備與線路的佈局架構稱為 ___。" },
        { term: "Redundancy", def: "冗餘/備援：提供備用鏈路防止單點故障。", fill: "提供備用設備或鏈路以確保高可用性稱為 ___。" },
        { term: "Encapsulation", def: "封裝：資料由上層往下層傳送時逐層加上 Header/Trailer。", fill: "資料下行時加上標頭的過程稱為 ___。" },
        { term: "Decapsulation", def: "解封裝：接收端將資料逐層拆開讀取標頭的過程。", fill: "接收端拆解標頭的過程稱為 ___。" },
        { term: "Frame", def: "資料幀：OSI 第二層（資料鏈結層）的資料格式。", fill: "OSI Layer 2 的資料單位是 ___。" },
        { term: "Packet", def: "封包：OSI 第三層（網路層）的資料格式。", fill: "OSI Layer 3 的資料單位是 ___。" },
        { term: "Subnet Mask", def: "子網路遮罩：用來區分 IP 位址中網路號與主機號的 32-bit 遮罩。", fill: "用來切割 IP 網段的 32 位元遮罩稱為 ___。" },
        { term: "Default Gateway", def: "預設閘道：當設備欲傳送封包至其他子網時的預設出口路由器 IP。", fill: "跨網段通訊時封包送往的預設出口稱為 ___。" },
        { term: "Unicast", def: "單播：一對一的通訊模式。", fill: "一對一傳送訊息的傳輸方式稱為 ___。" },
        { term: "Broadcast", def: "廣播：一對區域網路內所有設備的通訊。", fill: "一對同網段所有主機發送訊息稱為 ___。" },
        { term: "Multicast", def: "多播/組播：一對指定的特定群組通訊。", fill: "一對特定群組主機發送訊息稱為 ___。" },
        { term: "Routing Table", def: "路由表：路由器核心資料庫，紀錄目標網路與相對應介面。", fill: "路由器用來尋找最佳路徑的資料庫稱為 ___。" },
        { term: "Authentication", def: "身份驗證：確認使用者或設備身份的真實性。", fill: "AAA 機制中，驗證使用者身份稱為 ___。" }
    ];

    let currentList = [...rawData];
    let currentIndex = 0;
    let currentMode = 'flash-ec';
    let isShuffled = false;
    let isStarFiltered = false;
    let starredSet = new Set();
    let isAnswerRevealed = false;

    function speak(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = document.getElementById("accentSelect").value;
            utterance.rate = parseFloat(document.getElementById("speedSelect").value);
            window.speechSynthesis.speak(utterance);
        }
    }

    function updateList() {
        currentList = rawData.filter(item => !isStarFiltered || starredSet.has(item.term));
        if (isShuffled) {
            currentList.sort(() => Math.random() - 0.5);
        }
        currentIndex = 0;
        render();
    }

    function setMode(mode) {
        currentMode = mode;
        isAnswerRevealed = false;
        document.getElementById("overviewPanel").style.display = mode === 'overview' ? 'block' : 'none';
        document.getElementById("cardPanel").style.display = mode === 'overview' ? 'none' : 'flex';
        document.getElementById("controlPanel").style.display = mode === 'overview' ? 'none' : 'flex';
        render();
    }

    function toggleShuffle() {
        isShuffled = !isShuffled;
        document.getElementById("shuffleBtn").innerText = `🔀 隨機洗牌：${isShuffled ? '開啟' : '關閉'}`;
        updateList();
    }

    function toggleStarFilter() {
        isStarFiltered = !isStarFiltered;
        document.getElementById("starFilterBtn").innerText = `⭐ 只複習星號：${isStarFiltered ? '開啟' : '關閉'}`;
        updateList();
    }

    function toggleStar() {
        if (currentList.length === 0) return;
        const term = currentList[currentIndex].term;
        if (starredSet.has(term)) starredSet.delete(term);
        else starredSet.add(term);
        render();
    }

    function render() {
        if (currentMode === 'overview') {
            const listHtml = currentList.map(item => `
                <div class="overview-item">
                    <div><strong>${item.term}</strong><br><small>${item.def}</small></div>
                    <span style="cursor:pointer;" onclick="speak('${item.term}')">🔊</span>
                </div>
            `).join('');
            document.getElementById("overviewPanel").innerHTML = listHtml || "尚無資料";
            return;
        }

        const progress = document.getElementById("progressText");
        const termText = document.getElementById("termText");
        const defText = document.getElementById("defText");
        const starBtn = document.getElementById("starBtn");

        if (currentList.length === 0) {
            termText.innerText = "無符合條件單字";
            defText.innerText = "";
            progress.innerText = "0 / 0";
            return;
        }

        const item = currentList[currentIndex];
        progress.innerText = `${currentIndex + 1} / ${currentList.length}`;
        starBtn.className = `star-icon ${starredSet.has(item.term) ? 'active' : ''}`;

        if (currentMode === 'flash-ec') {
            termText.innerHTML = `${item.term} <span class="audio-play" onclick="speak('${item.term}')">🔊</span>`;
            defText.innerText = isAnswerRevealed ? item.def : "（點擊卡片顯示中文解釋）";
        } else if (currentMode === 'flash-ce') {
            termText.innerText = item.def;
            defText.innerHTML = isAnswerRevealed ? `${item.term} <span class="audio-play" onclick="speak('${item.term}')">🔊</span>` : "（點擊卡片顯示英文單字）";
        } else if (currentMode === 'listen') {
            termText.innerHTML = `<button class="btn btn-listen" onclick="speak('${item.term}')">🎧 點擊播放發音</button>`;
            defText.innerHTML = isAnswerRevealed ? `<strong>${item.term}</strong><br>${item.def}` : "（聽音後點擊顯示答案）";
        } else if (currentMode === 'type') {
            termText.innerHTML = `<button class="btn btn-type" onclick="speak('${item.term}')">🎧 點擊播放發音</button>`;
            defText.innerHTML = `
                <input type="text" id="userInput" class="input-box" placeholder="請輸入聽到的英文" onkeyup="checkAnswer(event)">
                <div id="typeFeedback" style="margin-top:10px;"></div>
            `;
            if (!isAnswerRevealed) speak(item.term);
        } else if (currentMode === 'fill') {
            termText.innerText = item.fill;
            defText.innerHTML = isAnswerRevealed ? `答案：<strong>${item.term}</strong><br>${item.def}` : "（點擊顯示答案）";
        }
    }

    function checkAnswer(e) {
        if (e.key === 'Enter') {
            const val = document.getElementById("userInput").value.trim().toLowerCase();
            const correct = currentList[currentIndex].term.toLowerCase();
            const feedback = document.getElementById("typeFeedback");
            if (val === correct) {
                feedback.innerHTML = "<span style='color:green; font-weight:bold;'>✅ 正確！</span>";
            } else {
                feedback.innerHTML = `<span style='color:red; font-weight:bold;'>❌ 錯誤，正確答案為：${currentList[currentIndex].term}</span>`;
            }
        }
    }

    document.getElementById("cardPanel").addEventListener("click", (e) => {
        if (e.target.tagName !== 'BUTTON' && e.target.tagName !== 'INPUT' && !e.target.classList.contains('star-icon') && !e.target.classList.contains('audio-play')) {
            isAnswerRevealed = !isAnswerRevealed;
            render();
        }
    });

    function nextCard() {
        if (currentList.length === 0) return;
        currentIndex = (currentIndex + 1) % currentList.length;
        isAnswerRevealed = false;
        render();
    }

    function prevCard() {
        if (currentList.length === 0) return;
        currentIndex = (currentIndex - 1 + currentList.length) % currentList.length;
        isAnswerRevealed = false;
        render();
    }

    // 初始化
    updateList();
</script>
</body>
</html>
