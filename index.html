<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CCNA 專業互動單字卡</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --accent: #f59e0b;
      --danger: #ef4444;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
      width: 100%;
      max-width: 650px;
    }

    h1 {
      font-size: 1.8rem;
      color: var(--primary);
      margin-bottom: 8px;
    }

    /* 🎛️ 控制面板 */
    .control-panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 16px;
      width: 100%;
      max-width: 650px;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }

    /* 🔍 搜尋欄位 CSS */
    .search-box {
      position: relative;
      width: 100%;
    }

    .search-box input {
      width: 100%;
      padding: 12px 40px 12px 16px;
      font-size: 15px;
      background: var(--bg-color);
      border: 2px solid var(--primary);
      border-radius: 25px;
      color: var(--text-main);
      outline: none;
      transition: all 0.3s ease;
    }

    .search-box input:focus {
      border-color: #60a5fa;
      box-shadow: 0 0 10px rgba(96, 165, 250, 0.3);
    }

    .search-box .clear-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: var(--text-sub);
      font-size: 16px;
      cursor: pointer;
      display: none;
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
    }

    select, button, input[type="text"] {
      background: var(--bg-color);
      color: var(--text-main);
      border: 1px solid var(--card-border);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      cursor: pointer;
      transition: all 0.2s;
    }

    button:hover {
      border-color: var(--primary);
      background: #1e293b;
    }

    .btn-primary {
      background: var(--primary);
      border: none;
      color: white;
      font-weight: bold;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .toggle-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      cursor: pointer;
      user-select: none;
    }

    /* 🃏 卡片區域 */
    .card-container {
      width: 100%;
      max-width: 650px;
      perspective: 1000px;
      min-height: 280px;
      margin-bottom: 20px;
    }

    .flashcard {
      background: var(--card-bg);
      border: 2px solid var(--card-border);
      border-radius: 16px;
      width: 100%;
      min-height: 280px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      cursor: pointer;
      transition: transform 0.3s, border-color 0.3s;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.4);
    }

    .flashcard:hover {
      border-color: var(--primary);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }

    .badge {
      font-size: 12px;
      background: #334155;
      padding: 4px 8px;
      border-radius: 12px;
      color: var(--text-sub);
    }

    .star-btn {
      background: transparent;
      border: none;
      font-size: 24px;
      color: var(--text-sub);
      cursor: pointer;
    }

    .star-btn.active {
      color: var(--accent);
    }

    .card-body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      flex-grow: 1;
      margin: 15px 0;
    }

    .term-text {
      font-size: 2rem;
      font-weight: bold;
      color: var(--text-main);
      margin-bottom: 10px;
    }

    .meaning-text {
      font-size: 1.1rem;
      color: #cbd5e1;
      line-height: 1.5;
    }

    .audio-btn {
      background: #334155;
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 10px;
      cursor: pointer;
    }

    /* 🎮 底部導覽按鈕 */
    .nav-controls {
      display: flex;
      gap: 12px;
      width: 100%;
      max-width: 650px;
      justify-content: space-between;
      align-items: center;
    }

    .nav-btn {
      flex: 1;
      padding: 12px;
      font-size: 16px;
      font-weight: bold;
    }

    .progress-text {
      font-size: 14px;
      color: var(--text-sub);
      text-align: center;
      white-space: nowrap;
    }

    /* 列表檢視模式 */
    .list-view {
      width: 100%;
      max-width: 650px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .list-item {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 12px 16px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <header>
    <h1>CCNA 專業互動單字庫</h1>
  </header>

  <div class="control-panel">
    <div class="search-box">
      <input 
        type="text" 
        id="searchInput" 
        placeholder="🔍 搜尋英文單字或中文解釋（輸入 1 個字即可）..." 
        oninput="handleSearch()"
      />
      <button class="clear-btn" id="clearSearchBtn" onclick="clearSearch()">✖</button>
    </div>

    <div class="row">
      <select id="moduleSelect" onchange="handleModuleChange()">
        <option value="all">📚 全部模組 (Module 1~6)</option>
        <option value="1">模組一：網路基礎與拓撲</option>
        <option value="2">模組二：IP 位址與子網劃分</option>
        <option value="3">模組三：路由與交換</option>
        <option value="4">模組四：網路服務與協定</option>
        <option value="5">模組五：安全性與存取控制</option>
        <option value="6">模組六：自動化、管理與除錯</option>
      </select>

      <select id="modeSelect" onchange="handleModeChange()">
        <option value="flashcard-ez">🔤 閃卡 (英➔中)</option>
        <option value="flashcard-ze">🈳 閃卡 (中➔英)</option>
        <option value="list">📖 全覽清單模式</option>
      </select>
    </div>

    <div class="row">
      <div style="display: flex; gap: 6px; align-items: center;">
        <select id="voiceLang" style="font-size: 12px;">
          <option value="en-US">🇺🇸 美式</option>
          <option value="en-GB">🇬🇧 英式</option>
        </select>
        <select id="voiceRate" style="font-size: 12px;">
          <option value="0.75">0.75x 慢速</option>
          <option value="1.0" selected>1.0x 正常</option>
          <option value="1.25">1.25x 快速</option>
        </select>
      </div>

      <label class="toggle-btn">
        <input type="checkbox" id="shuffleToggle" onchange="handleShuffleToggle()" /> 🔀 隨機洗牌
      </label>

      <label class="toggle-btn">
        <input type="checkbox" id="starredToggle" onchange="handleStarredToggle()" /> ★ 只看收藏
      </label>
    </div>

    <div class="row" style="margin-top: 5px;">
      <button onclick="syncGoogleSheets()" style="width: 100%; font-size: 12px; color: var(--text-sub);">
        🔄 雲端數據同步 (Google 試算表)
      </button>
    </div>
  </div>

  <div class="card-container" id="cardContainer">
    <div class="flashcard" onclick="flipCard()">
      <div class="card-header">
        <span class="badge" id="cardModuleBadge">Module 1</span>
        <button class="star-btn" id="starBtn" onclick="toggleStar(event)">★</button>
      </div>
      <div class="card-body">
        <div class="term-text" id="cardMainText">Bandwidth</div>
        <div class="meaning-text hidden" id="cardSubText">頻寬：網路鏈路最大可傳輸資料的容量。</div>
        <button class="audio-btn" id="audioBtn" onclick="speakCurrent(event)">🔊</button>
      </div>
      <div style="text-align: center; font-size: 12px; color: var(--text-sub);">
        💡 點擊卡片任意處切換顯示/隱藏
      </div>
    </div>
  </div>

  <div class="list-view hidden" id="listView"></div>

  <div class="nav-controls" id="navControls">
    <button class="nav-btn" onclick="prevCard()">◄ 上一張</button>
    <span class="progress-text" id="progressText">0 / 0</span>
    <button class="nav-btn btn-primary" onclick="nextCard()">下一張 ►</button>
  </div>

  <script>
    // 預設 Google 試算表 CSV 連結 (可自動讀取)
    const DEFAULT_CSV_URL = "https://docs.google.com/spreadsheets/d/11TPk1y13fu6YPRX5Ai0zTHIaaD1ZPoz1MXW9oj18ow0/export?format=csv";

    // 內建備用單字庫 (當網路中斷或試算表無法讀取時自動備援)
    const fallbackCards = [
      { id: 1, term: "Bandwidth", meaning: "頻寬：網路鏈路最大可傳輸資料的容量（如 1 Gbps）。", module: 1 },
      { id: 2, term: "Throughput", meaning: "吞吐量：單位時間內實際成功傳送的資料量。", module: 1 },
      { id: 3, term: "Latency", meaning: "延遲：封包從來源端到達目的地所需的時間。", module: 1 },
      { id: 4, term: "TCP Sequencing", meaning: "TCP 順序控制：將資料切塊並編號重組的機制。", module: 4 },
      { id: 5, term: "Handshake", meaning: "握手：TCP 建立連線的三向握手機制 (SYN, SYN-ACK, ACK)。", module: 4 },
      { id: 6, term: "Spanning Tree Protocol (STP)", meaning: "生成樹協定：防止二層交換網路產生迴路 (Loop)。", module: 3 },
      { id: 7, term: "Authentication", meaning: "身份驗證：確認使用者或設備身份的真實性 (AAA 第一個 A)。", module: 5 }
    ];

    let rawCards = [];
    let filteredCards = [];
    let currentIndex = 0;
    let isFlipped = false;
    let starredIds = new Set(JSON.parse(localStorage.getItem('ccna_starred_cards') || '[]'));
    let searchKeyword = "";

    // 🚀 初始化載入
    window.onload = function() {
      fetchSheetData();
    };

    // 📥 讀取 Google 試算表 CSV 資料
    function fetchSheetData() {
      const csvUrl = localStorage.getItem('ccna_csv_url') || DEFAULT_CSV_URL;
      fetch(csvUrl)
        .then(res => res.text())
        .then(csvText => {
          parseCSV(csvText);
        })
        .catch(err => {
          console.warn("無法讀取雲端試算表，改用備用資料庫", err);
          rawCards = fallbackCards;
          applyFilters();
        });
    }

    // 📊 解析 CSV 格式
    function parseCSV(text) {
      const lines = text.split('\n');
      const cards = [];
      for (let i = 1; i < lines.length; i++) {
        const line = lines[i].trim();
        if (!line) continue;
        const parts = line.split(',');
        if (parts.length >= 2) {
          cards.push({
            id: i,
            term: parts[0].trim(),
            meaning: parts[1].trim(),
            module: parts[2] ? parseInt(parts[2].trim()) || 1 : 1
          });
        }
      }
      rawCards = cards.length > 0 ? cards : fallbackCards;
      applyFilters();
    }

    // 🔍 搜尋與過濾核心邏輯
    function applyFilters() {
      const selectedModule = document.getElementById('moduleSelect').value;
      const starredOnly = document.getElementById('starredToggle').checked;
      const isShuffle = document.getElementById('shuffleToggle').checked;

      // 1. 模組過濾
      let list = selectedModule === 'all' 
        ? [...rawCards] 
        : rawCards.filter(c => c.module == selectedModule);

      // 2. 星號過濾
      if (starredOnly) {
        list = list.filter(c => starredIds.has(c.term));
      }

      // 3. 🔍 關鍵字搜尋過濾 (英中雙向)
      if (searchKeyword) {
        list = list.filter(c => 
          (c.term && c.term.toLowerCase().includes(searchKeyword)) ||
          (c.meaning && c.meaning.toLowerCase().includes(searchKeyword))
        );
      }

      // 4. 隨機洗牌
      if (isShuffle) {
        list.sort(() => Math.random() - 0.5);
      }

      filteredCards = list;
      currentIndex = 0;
      isFlipped = false;
      updateDisplay();
    }

    // 🔍 搜尋輸入監聽
    function handleSearch() {
      const input = document.getElementById('searchInput');
      searchKeyword = input.value.trim().toLowerCase();
      document.getElementById('clearSearchBtn').style.display = searchKeyword ? 'block' : 'none';
      applyFilters();
    }

    // ✖ 清空搜尋欄
    function clearSearch() {
      document.getElementById('searchInput').value = '';
      handleSearch();
    }

    // 🖥️ 更新畫面顯示
    function updateDisplay() {
      const mode = document.getElementById('modeSelect').value;
      const cardContainer = document.getElementById('cardContainer');
      const listView = document.getElementById('listView');
      const navControls = document.getElementById('navControls');

      if (filteredCards.length === 0) {
        document.getElementById('cardMainText').innerText = "🔍 找不到相符的單字";
        document.getElementById('cardSubText').innerText = "請嘗試搜尋其他關鍵字或切換模組。";
        document.getElementById('cardSubText').classList.remove('hidden');
        document.getElementById('progressText').innerText = "0 / 0";
        return;
      }

      if (mode === 'list') {
        cardContainer.classList.add('hidden');
        navControls.classList.add('hidden');
        listView.classList.remove('hidden');
        renderListView();
        return;
      }

      cardContainer.classList.remove('hidden');
      navControls.classList.remove('hidden');
      listView.classList.add('hidden');

      const card = filteredCards[currentIndex];
      document.getElementById('cardModuleBadge').innerText = `Module ${card.module}`;
      
      const starBtn = document.getElementById('starBtn');
      if (starredIds.has(card.term)) {
        starBtn.classList.add('active');
      } else {
        starBtn.classList.remove('active');
      }

      // 閃卡模式切換
      if (mode === 'flashcard-ez') { // 英 ➔ 中
        document.getElementById('cardMainText').innerText = card.term;
        document.getElementById('cardSubText').innerText = card.meaning;
      } else { // 中 ➔ 英
        document.getElementById('cardMainText').innerText = card.meaning;
        document.getElementById('cardSubText').innerText = card.term;
      }

      if (isFlipped) {
        document.getElementById('cardSubText').classList.remove('hidden');
      } else {
        document.getElementById('cardSubText').classList.add('hidden');
      }

      document.getElementById('progressText').innerText = `${currentIndex + 1} / ${filteredCards.length}`;
    }

    // 📖 渲染全覽清單
    function renderListView() {
      const listView = document.getElementById('listView');
      listView.innerHTML = filteredCards.map(card => `
        <div class="list-item">
          <div>
            <strong style="color: var(--primary); font-size: 16px;">${card.term}</strong>
            <p style="color: var(--text-sub); font-size: 14px; margin-top: 4px;">${card.meaning}</p>
          </div>
          <button class="star-btn ${starredIds.has(card.term) ? 'active' : ''}" onclick="toggleStarByTerm('${card.term}')">★</button>
        </div>
      `).join('');
    }

    // 🔄 切換翻面
    function flipCard() {
      isFlipped = !isFlipped;
      updateDisplay();
    }

    // ◄ 上一張 / 下一張 ►
    function nextCard() {
      if (filteredCards.length === 0) return;
      currentIndex = (currentIndex + 1) % filteredCards.length;
      isFlipped = false;
      updateDisplay();
    }

    function prevCard() {
      if (filteredCards.length === 0) return;
      currentIndex = (currentIndex - 1 + filteredCards.length) % filteredCards.length;
      isFlipped = false;
      updateDisplay();
    }

    // ★ 收藏切換
    function toggleStar(e) {
      e.stopPropagation();
      if (filteredCards.length === 0) return;
      const term = filteredCards[currentIndex].term;
      toggleStarByTerm(term);
    }

    function toggleStarByTerm(term) {
      if (starredIds.has(term)) {
        starredIds.delete(term);
      } else {
        starredIds.add(term);
      }
      localStorage.setItem('ccna_starred_cards', JSON.stringify([...starredIds]));
      updateDisplay();
    }

    // 🔊 語音發音 (TTS)
    function speakCurrent(e) {
      if (e) e.stopPropagation();
      if (filteredCards.length === 0) return;
      const card = filteredCards[currentIndex];
      const utterance = new SpeechSynthesisUtterance(card.term);
      utterance.lang = document.getElementById('voiceLang').value;
      utterance.rate = parseFloat(document.getElementById('voiceRate').value);
      window.speechSynthesis.speak(utterance);
    }

    // 🎛️ 選單事件處理
    function handleModuleChange() { applyFilters(); }
    function handleModeChange() { updateDisplay(); }
    function handleShuffleToggle() { applyFilters(); }
    function handleStarredToggle() { applyFilters(); }

    // 🔗 手動設定試算表網址
    function syncGoogleSheets() {
      const url = prompt("請貼上您的 Google 試算表 CSV 連結：", localStorage.getItem('ccna_csv_url') || DEFAULT_CSV_URL);
      if (url) {
        localStorage.setItem('ccna_csv_url', url.trim());
        fetchSheetData();
      }
    }
  </script>
</body>
</html>
